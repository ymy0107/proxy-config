# ==========================================
# OpenVPN TCP 服务端配置文件 (与原 UDP 并存)
# ==========================================
port 1194
proto tcp-server
dev tun

user nobody
group nogroup
persist-key
persist-tun
keepalive 10 120
topology subnet

# 【重要】使用全新的虚拟网段，避免与 UDP 的 10.8.0.0/24 冲突
server 10.9.0.0 255.255.255.0
ifconfig-pool-persist ipp-tcp.txt

push "dhcp-option DNS 1.0.0.1"
push "dhcp-option DNS 1.1.1.1"
push "redirect-gateway def1 bypass-dhcp"
push "block-ipv6"

dh none
tls-groups X25519:prime256v1:secp384r1:secp521r1
tls-crypt-v2 tls-crypt-v2.key
crl-verify crl.pem

# 证书与密钥保持共用（无须重新生成）
ca ca.crt
cert server_8r4EK251RRKLIG7i.crt
key server_8r4EK251RRKLIG7i.key

auth SHA256
cipher AES-128-GCM
ignore-unknown-option data-ciphers
data-ciphers AES-128-GCM
ncp-ciphers AES-128-GCM

tls-server
tls-version-min 1.2
remote-cert-tls client
tls-cipher TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256

client-config-dir ccd
# 区分日志和套接字名称，防止覆盖冲突
status /var/log/openvpn/status-tcp.log
management /var/run/openvpn-server/server-tcp.sock unix
verb 3